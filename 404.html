<!DOCTYPE html>
<head>
    <title>Voxity</title>
    <style>
        body {
            background-color: black;
        }

        img {
            width: 100%;
            height: 100%;
            bottom: 0;
            left: 0;
            margin: auto;
            overflow: auto;
            position: fixed;
            right: 0;
            top: 0;
            -o-object-fit: contain;
            object-fit: contain;
        }
    </style>
    <link rel="icon" href="https://obunga.exerinity.com/obunga.jpg" type="image/x-icon">
    <meta name="description" content="Obunga">
    <meta property="og:image" content="obunga.jpg">
    <meta property="twitter:image" content="obunga.jpg">
    <meta property="image" content="obunga.jpg">
    <meta property="og:title" content="Obunga">
</head>

<body>
    <img src="https://obunga.exerinity.com/obunga.jpg">
    <audio autoplay loop>
        <source src="https://obunga.exerinity.com/obunga.ogg" type="audio/ogg">
    </audio>
    <script>
        document.addEventListener('click', function () {
            document.querySelector('audio').play();
        });
    </script>
</body>
