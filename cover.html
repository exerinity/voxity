<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Voxity art viewer</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <img id="img" alt="">
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get("img");
    const name = params.get("name") || "Voxity";
    document.title = name + ' / Voxity';
    const img = document.getElementById("img");
    img.src = decodeURIComponent(src);

    img.onload = () => {
      if (img.src.startsWith("blob:")) {
        window.addEventListener("beforeunload", () => URL.revokeObjectURL(img.src));
      }
    };
  </script>
</body>

</html>
